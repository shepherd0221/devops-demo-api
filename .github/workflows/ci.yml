
name: CI and GitOps CD

on:
  push:
    branches:
      - main
    # 避免只更新部署 YAML 時再次觸發 CI
    paths-ignore:
      - "k8s/deployment.yaml"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "k8s/deployment.yaml"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run pytest
        run: pytest

  build-push-update:
    name: Build, Push and Update GitOps Manifest
    needs: test

    # 只在 main 分支的 push 執行，不在 PR 執行
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update deployment.yaml with new image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("k8s/deployment.yaml")
          content = path.read_text(encoding="utf-8")

          pattern = (
              r"(?m)^([ \t]*image:[ \t]*)"
              r"ghcr\.io/shepherd0221/devops-demo-api:[^\s#]+"
              r"([ \t]*(?:#.*)?)$"
          )

          replacement = (
              lambda match:
              match.group(1)
              + os.environ["IMAGE"]
              + ":"
              + os.environ["IMAGE_TAG"]
              + match.group(2)
          )

          updated, count = re.subn(pattern, replacement, content)

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one GHCR image in {path}, "
                  f"but found {count}. Check the image line."
              )

          path.write_text(updated, encoding="utf-8")
          print(f"Updated image to {os.environ['IMAGE']}:{os.environ['IMAGE_TAG']}")
          PY

      - name: Commit and push GitOps manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "chore(gitops): update image to sha-${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main
